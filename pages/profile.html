<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile - Velora</title>

    <!-- FontAwesome Icons -->
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      rel="stylesheet"
    />
    <link href="/src/output.css" rel="stylesheet" />

    <!-- Profile Script -->
    <script src="../js/profile.js" defer></script>
  </head>
  <body
    class="font-[Segoe_UI] bg-gradient-to-br from-[#f0f4f8] to-[#e8ecf1] min-h-screen flex flex-col"
  >
    <!-- Back Button -->
    <header class="flex justify-end p-4">
      <a
        href="dashboard.html"
        class="inline-flex items-center gap-2 px-4 py-2 bg-blue-950 text-yellow-400 font-semibold rounded-md shadow hover:bg-blue-900 transition text-sm sm:text-base"
      >
        <i class="fas fa-arrow-left"></i> Back to Dashboard
      </a>
    </header>

    <main class="flex-grow flex items-center justify-center px-4">
      <section
        class="profile-card w-full max-w-lg bg-white rounded-xl shadow-lg p-6 sm:p-8"
      >
        <h2
          class="text-center text-xl sm:text-2xl font-bold text-blue-950 mb-6"
        >
          <i class="fas fa-id-badge mr-2"></i> User Profile
        </h2>

        <!-- Avatar -->
        <div class="flex justify-center mb-6">
          <img
            id="user-avatar"
            src="/public/images/default-avatar.webp"
            alt="User Avatar"
            class="w-32 h-32 sm:w-40 sm:h-40 rounded-full object-cover border-4 border-yellow-400 shadow-md"
          />
        </div>

        <!-- Profile Items -->
        <div class="space-y-4">
          <div
            class="flex items-center gap-3 py-2 border-b border-gray-200 text-sm sm:text-lg text-slate-700"
          >
            <i class="fas fa-user text-yellow-400 text-lg sm:text-xl"></i>
            <span
              ><strong>Username:</strong>
              <span id="profile-username">Loading...</span></span
            >
          </div>

          <div
            class="flex items-center gap-3 py-2 border-b border-gray-200 text-sm sm:text-lg text-slate-700"
          >
            <i class="fas fa-signature text-yellow-400 text-lg sm:text-xl"></i>
            <span
              ><strong>Full Name:</strong>
              <span id="profile-fullname">Loading...</span></span
            >
          </div>

          <div
            class="flex items-center gap-3 py-2 border-b border-gray-200 text-sm sm:text-lg text-slate-700"
          >
            <i class="fas fa-envelope text-yellow-400 text-lg sm:text-xl"></i>
            <span
              ><strong>Email:</strong>
              <span id="profile-email">Loading...</span></span
            >
          </div>

          <div
            class="flex items-center gap-3 py-2 text-sm sm:text-lg text-slate-700"
          >
            <i class="fas fa-phone text-yellow-400 text-lg sm:text-xl"></i>
            <span
              ><strong>Phone:</strong>
              <span id="profile-phone">Loading...</span></span
            >
          </div>
        </div>

        <!-- Edit Note -->
        <p class="mt-6 text-center text-sm sm:text-lg text-slate-600">
          <i class="fas fa-pen text-slate-500 mr-2"></i>
          To update your info, visit
          <a
            href="settings.html"
            class="text-blue-950 font-semibold hover:underline"
            >Settings</a
          >.
        </p>
      </section>
    </main>
  </body>
</html>
