<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Track Orders | Velora Admin</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <link rel="stylesheet" href="/src/output.css" />
  </head>
  <body class="bg-[#f1f5f9] font-[Segoe_UI] min-h-screen">
    <!-- Navbar -->
    <nav
      class="bg-[#8BC34A] text-white px-4 py-3 flex justify-between items-center shadow"
    >
      <div class="flex items-center gap-3">
        <!-- Back Button -->
        <button
          onclick="window.location.href = '/admin/pages/admin-dashbaord.html'"
          class="flex items-center gap-2 px-3 py-1 rounded bg-white text-[#8BC34A] hover:bg-gray-100 transition"
        >
          <i class="fas fa-arrow-left"></i> Back
        </button>
        <span class="font-bold text-lg flex items-center gap-2">
          <i class="fas fa-box"></i> Order Tracking
        </span>
      </div>
    </nav>

    <!-- Container -->
    <div class="max-w-6xl mx-auto p-6">
      <!-- Header -->
      <div
        class="flex flex-col sm:flex-row justify-between items-center mt-6 gap-3"
      >
        <h3 class="text-xl font-semibold text-gray-700">All Orders</h3>
        <input
          type="text"
          id="searchInput"
          class="w-full sm:w-64 px-3 py-2 border rounded-md focus:ring-2 focus:ring-[#8BC34A] outline-none"
          placeholder="Search by user or product"
        />
      </div>

      <!-- Table -->
      <div class="overflow-x-auto mt-6 bg-white rounded-lg shadow-lg">
        <table class="min-w-full text-sm text-left border-collapse">
          <thead class="bg-[#8BC34A] text-white">
            <tr>
              <th class="px-4 py-2">#</th>
              <th class="px-4 py-2">User</th>
              <th class="px-4 py-2">Product</th>
              <th class="px-4 py-2">Price</th>
              <th class="px-4 py-2">Date</th>
              <th class="px-4 py-2">Status</th>
            </tr>
          </thead>
          <tbody id="orderTableBody" class="divide-y divide-gray-200">
            <!-- Orders will be injected here via JS -->
          </tbody>
        </table>
      </div>
    </div>

    <script>
      function logout() {
        localStorage.clear();
        // window.location.href = "/pages/login.html";
      }
    </script>
    <script src="/admin/js/admin-orders.js"></script>
  </body>
</html>
