<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Velora Admin Dashboard</title>

    <!-- FontAwesome Icons -->
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      rel="stylesheet"
    />
    <!-- Tailwind CSS -->
    <link href="/src/output.css" rel="stylesheet" />
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="/admin/js/admin-dashbaord.js"></script>
  </head>
  <body class="min-h-screen bg-gray-100 font-[Segoe_UI] flex">
    <!-- Sidebar -->
    <aside class="w-64 bg-green-600 text-white flex flex-col p-6">
      <h2 class="text-2xl font-bold mb-8 flex items-center gap-2">
        <i class="fas fa-tshirt"></i> Velora Admin
      </h2>
      <nav class="flex flex-col gap-4">
        <a
          href="admin-users.html"
          class="flex items-center gap-2 hover:text-gray-200"
        >
          <i class="fas fa-users"></i> Users
        </a>
        <a
          href="admin-orders.html"
          class="flex items-center gap-2 hover:text-gray-200"
        >
          <i class="fas fa-box"></i> Orders
        </a>

        <button
          onclick="logout()"
          class="flex items-center gap-2 mt-auto px-4 py-2 bg-white text-green-600 font-semibold rounded-md shadow hover:bg-gray-100 transition"
        >
          <i class="fas fa-sign-out-alt"></i> Logout
        </button>
      </nav>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 p-8">
      <h2 class="text-2xl font-bold text-green-600 mb-6">Dashboard Overview</h2>

      <!-- Cards -->
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-6 mb-8">
        <!-- Users Card -->
        <div class="bg-white rounded-xl shadow p-6 flex items-center gap-4">
          <i class="fas fa-users text-green-500 text-4xl"></i>
          <div>
            <h3 class="text-lg font-semibold text-green-600">Total Users</h3>
            <!-- Value will be injected from localStorage -->
            <p id="usersCount" class="text-3xl font-bold">0</p>
          </div>
        </div>

        <!-- Orders Card -->
        <div class="bg-white rounded-xl shadow p-6 flex items-center gap-4">
          <i class="fas fa-box text-green-500 text-4xl"></i>
          <div>
            <h3 class="text-lg font-semibold text-green-600">Total Orders</h3>
            <!-- Value will be injected from localStorage -->
            <p id="ordersCount" class="text-3xl font-bold">0</p>
          </div>
        </div>
      </div>

      <!-- Charts Section -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <!-- Bar Chart -->
        <div class="bg-white rounded-xl shadow p-6">
          <h3 class="text-lg font-semibold text-green-600 mb-4">
            Sales Statistics
          </h3>
          <canvas id="salesChart" height="120"></canvas>
        </div>

        <!-- Doughnut Chart -->
        <div class="bg-white rounded-xl shadow p-6">
          <h3 class="text-lg font-semibold text-green-600 mb-4">
            Order Status Distribution
          </h3>
          <canvas id="statusChart" height="120"></canvas>
        </div>
      </div>
    </main>
  </body>
</html>
