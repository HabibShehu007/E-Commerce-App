<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Login | Velora</title>

    <!-- FontAwesome Icons -->
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      rel="stylesheet"
    />
    <!-- Tailwind CSS -->
    <link href="/src/output.css" rel="stylesheet" />
  </head>
  <body
    class="min-h-screen flex items-center justify-center bg-white font-[Segoe_UI]"
  >
    <!-- Login Box -->
    <div
      class="w-full max-w-md bg-white p-8 rounded-xl shadow-lg border border-gray-200"
    >
      <h2
        class="text-center text-2xl font-bold text-green-500 mb-6 flex items-center justify-center gap-2"
      >
        <i class="fas fa-lock text-green-500"></i> Velora Admin Login
      </h2>

      <form id="adminLoginForm" class="flex flex-col gap-4">
        <!-- Username -->
        <div class="relative">
          <i class="fas fa-user absolute left-3 top-3 text-gray-400"></i>
          <input
            type="text"
            id="adminUsername"
            placeholder="Admin Username"
            required
            class="w-full pl-10 pr-3 py-2 rounded-md border border-gray-300 focus:outline-none focus:ring-2 focus:ring-green-400"
          />
        </div>

        <!-- Password -->
        <div class="relative">
          <i class="fas fa-key absolute left-3 top-3 text-gray-400"></i>
          <input
            type="password"
            id="adminPassword"
            placeholder="Password"
            required
            class="w-full pl-10 pr-3 py-2 rounded-md border border-gray-300 focus:outline-none focus:ring-2 focus:ring-green-400"
          />
        </div>

        <!-- Login Button -->
        <button
          type="submit"
          id="loginBtn"
          class="w-full flex items-center justify-center gap-2 px-4 py-2 bg-green-400 text-white font-semibold rounded-md shadow hover:bg-green-500 transition"
        >
          <span id="loginBtnText"
            ><i class="fas fa-sign-in-alt"></i> Login</span
          >
          <!-- Spinner (hidden by default) -->
          <span id="loginSpinner" class="hidden">
            <i class="fas fa-spinner fa-spin"></i>
          </span>
        </button>

        <!-- Error Message -->
        <div id="errorMsg" class="text-center text-red-500 text-sm mt-2"></div>
      </form>

      <!-- Link to admin dashboard for testing -->
      <p class="text-center mt-2 text-xs text-gray-600">
        <i class="fas fa-user-shield mr-1 text-green-500"></i>
        For testing, go directly to
        <a
          href="/admin/pages/admin-dashboard.html"
          class="text-green-500 hover:underline font-semibold"
        >
          Admin Dashboard
        </a>
      </p>
    </div>

    <!-- Modal (hidden by default) -->
    <div
      id="loginModal"
      class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50"
    >
      <div class="bg-white rounded-lg shadow-lg p-6 max-w-sm text-center">
        <i class="fas fa-check-circle text-green-500 text-4xl mb-3"></i>
        <h3 class="text-lg font-semibold text-green-600 mb-2">
          Login Successful
        </h3>
        <p class="text-sm text-gray-600 mb-4">Welcome back, Admin!</p>
        <div class="flex justify-center">
          <button
            id="closeModalBtn"
            class="px-4 py-2 bg-green-400 text-white rounded-md hover:bg-green-500 transition"
          >
            OK
          </button>
        </div>
      </div>
    </div>

    <!-- JS will be added later -->
    <script src="../js/admin-login.js"></script>
  </body>
</html>
