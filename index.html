<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Velora</title>
    <link rel="icon" href="images/favicon.ico" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./src/output.css">
</head>
<body class="bg-gray-50 font-['Inter'] antialiased">

    <section id="splash-screen" class="fixed inset-0 z-50 flex flex-col items-center justify-center bg-white transition-opacity duration-700">
        <div class="text-center">
            <img src="images/logo.png" alt="Velora Logo" id="logo" class="mx-auto mb-6 h-24 w-auto animate-pulse">
            <h2 id="tagline" class="font-['Poppins'] text-xl font-bold tracking-tight text-gray-900">Think Forward, Spend Smarter</h2>
        </div>
    </section>

    <section id="onboarding-screen" class="relative flex min-h-screen items-center justify-center p-6">
        <div class="w-full max-w-md overflow-hidden rounded-3xl bg-white shadow-xl">
            
            <div class="onboarding-step onboarding-step-1 flex flex-col items-center p-8 text-center">
                <div class="mb-8 overflow-hidden rounded-2xl bg-gray-100">
                    <img src="images/Onboarding1.png" alt="Onboarding Image 1" class="h-64 w-full object-cover">
                </div>
                <h3 class="mb-3 font-['Poppins'] text-2xl font-bold text-gray-900">Find Looks You Love</h3>
                <p class="mb-8 text-gray-500">From timeless classics to trending pieces—Shop what fits the vibe.</p>
                
                <div class="mb-6 w-full">
                    <button id="next-btn" class="w-full rounded-full bg-black py-4 font-semibold text-white transition-transform active:scale-95 hover:bg-gray-800">
                        Next
                    </button>
                </div>
                
                <div class="flex gap-2">
                    <span class="h-2 w-8 rounded-full bg-black transition-all"></span>
                    <span class="h-2 w-2 rounded-full bg-gray-300"></span>
                </div>
            </div>

            <div class="onboarding-step onboarding-step-2 hidden flex flex-col items-center p-8 text-center">
                <div class="mb-8 overflow-hidden rounded-2xl bg-gray-100">
                    <img src="images/Onboarding2.png" alt="Onboarding Image 2" class="h-64 w-full object-cover">
                </div>
                <h3 class="mb-3 font-['Poppins'] text-2xl font-bold text-gray-900">First Purchase Special Offer</h3>
                <p class="mb-8 text-gray-500">Enjoy exclusive offers when you sign up today.</p>
                
                <div class="mb-6 w-full">
                    <button id="start-btn" class="w-full rounded-full bg-black py-4 font-semibold text-white transition-transform active:scale-95 hover:bg-gray-800">
                        Get Started
                    </button>
                </div>
                
                <div class="flex gap-2">
                    <span class="h-2 w-2 rounded-full bg-gray-300"></span>
                    <span class="h-2 w-8 rounded-full bg-black transition-all"></span>
                </div>
            </div>
        </div>
    </section>

    <div id="loading-overlay" class="fixed inset-0 z-40 hidden flex flex-col items-center justify-center bg-black/40 backdrop-blur-sm">
        <div class="h-12 w-12 animate-spin rounded-full border-4 border-white border-t-transparent"></div>
        <p class="mt-4 font-medium text-white">Redirecting... Please wait</p>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
